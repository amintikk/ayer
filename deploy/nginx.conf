# nginx of the "ayer" container (https://ayer.aminox.dev, behind Nginx Proxy Manager).
# Serves the static site and a caching proxy to the IGN services under /ign/, so that the IGN gets
# fewer requests and never sees the visitors' IP addresses. Only the layers, sizes and formats the
# site uses are allowed through; everything is rate limited per visitor.
load_module modules/ngx_http_js_module.so;

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    types {
        application/manifest+json webmanifest;
        text/javascript mjs;
    }
    # NPM already logs requests in front of this container; keep no second copy here.
    access_log off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    absolute_redirect off;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json image/svg+xml application/manifest+json;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json application/xml;
    gzip_min_length 1024;

    # Docker's DNS; the IGN is behind a CDN whose addresses change, so re-resolve them.
    resolver 127.0.0.11 valid=300s ipv6=off;
    js_import og from /etc/nginx/og.js;
    js_set $og_image og.image;
    js_set $og_upstream og.upstream;

    upstream ign {
        zone ign 64k;
        server www.ign.es:443 resolve max_fails=0;
        keepalive 16;
    }
    upstream cartociudad {
        zone cartociudad 64k;
        server www.cartociudad.es:443 resolve max_fails=0;
        keepalive 4;
    }

    # Tile cache: at most 4 GB (the host disk had 38 GB free when this was set), kept 90 days
    # since last use. It lives inside the container on purpose: it is regenerable and needs no backup.
    proxy_cache_path /var/cache/nginx/ign levels=1:2 keys_zone=tilecache:64m max_size=4g inactive=90d use_temp_path=off;
    proxy_cache_path /var/cache/nginx/geo levels=1:2 keys_zone=geocache:8m max_size=200m inactive=14d use_temp_path=off;

    # The site was in English too until 2026-11-20; old /en/ addresses redirect to their Spanish page.
    map $uri $en_to_es {
        default /;
        /en/ /;
        /en/map/ /mapa/;
        /en/places/ /lugares/;
        /en/places/benidorm/ /lugares/benidorm/;
        /en/places/puerto-banus-marbella/ /lugares/puerto-banus-marbella/;
        /en/places/madrid-barajas-airport/ /lugares/aeropuerto-madrid-barajas/;
        /en/places/bilbao-guggenheim-abandoibarra/ /lugares/bilbao-guggenheim-abandoibarra/;
        /en/places/valencia-city-of-arts-and-sciences/ /lugares/valencia-ciudad-artes-ciencias/;
        /en/places/el-ejido-greenhouses/ /lugares/el-ejido-invernaderos/;
        /en/places/port-of-barcelona/ /lugares/puerto-de-barcelona/;
        /en/places/seville-isla-de-la-cartuja-expo-92/ /lugares/sevilla-isla-cartuja-expo-92/;
        /en/places/barcelona-olympic-village/ /lugares/barcelona-vila-olimpica/;
        /en/places/torrevieja/ /lugares/torrevieja/;
        /en/places/sesena-el-quinon/ /lugares/sesena-el-quinon/;
        /en/places/madrid-four-towers/ /lugares/madrid-cuatro-torres/;
        /en/places/zaragoza-expo-2008/ /lugares/zaragoza-expo-2008/;
        /en/places/salou-portaventura/ /lugares/salou-portaventura/;
        /en/places/magaluf-calvia/ /lugares/magaluf-calvia/;
        /en/places/maspalomas-playa-del-ingles/ /lugares/maspalomas-playa-del-ingles/;
        /en/places/riano-reservoir/ /lugares/embalse-de-riano/;
        /en/places/barcelona-el-prat-airport/ /lugares/aeropuerto-barcelona-el-prat/;
        /en/legal-notice/ /aviso-legal/;
        /en/privacy/ /privacidad/;
        /en/terms/ /terminos/;
        /en/credits/ /creditos/;
    }

    # The visitor's address as seen by Cloudflare / NPM, only for rate limiting (never logged here).
    map $http_cf_connecting_ip $client {
        "" $http_x_real_ip;
        default $http_cf_connecting_ip;
    }
    map $client $client_key {
        "" $remote_addr;
        default $client;
    }
    limit_req_zone $client_key zone=tiles:20m rate=60r/s;
    limit_req_zone $client_key zone=geo:10m rate=6r/s;
    limit_req_zone $client_key zone=og:10m rate=2r/s;
    limit_req_status 429;

    # Allow-list for the historical WMS: our layers, 256 px map tiles or 32 px coverage probes.
    map $arg_LAYERS $wms_layer {
        "~^(AMS_1956-1957|Interministerial_1973-1986|Nacional_1981-1986|OLISTAT|SIGPAC|PNOA20(0[4-9]|1[0-9]|2[0-4]))$" 1;
        default 0;
    }
    map "$arg_WIDTH:$arg_HEIGHT" $wms_size {
        "256:256" 1;
        "32:32" 1;
        default 0;
    }
    map $arg_BBOX $wms_bbox {
        "~^-?[0-9]{1,8}(\.[0-9]+)?,-?[0-9]{1,8}(\.[0-9]+)?,-?[0-9]{1,8}(\.[0-9]+)?,-?[0-9]{1,8}(\.[0-9]+)?$" 1;
        default 0;
    }
    map "$wms_layer$wms_size$wms_bbox" $wms_ok {
        "111" 1;
        default 0;
    }
    map "$arg_TileMatrix:$arg_TileCol:$arg_TileRow" $wmts_ok {
        "~^[0-9]{1,2}:[0-9]{1,7}:[0-9]{1,7}$" 1;
        default 0;
    }

    # Shared settings for every request to the IGN: no visitor data goes upstream.
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_connect_timeout 10s;
    proxy_read_timeout 45s;
    proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
    proxy_next_upstream_tries 4;
    proxy_next_upstream_timeout 60s;
    proxy_cache_lock on;
    proxy_cache_lock_timeout 30s;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
    proxy_cache_background_update on;
    proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
    proxy_hide_header Set-Cookie;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Cache-Control;
    proxy_hide_header Expires;
    proxy_hide_header Last-Modified;
    proxy_hide_header Content-Disposition;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Via;
    proxy_hide_header X-Amz-Cf-Id;
    proxy_hide_header X-Amz-Cf-Pop;
    proxy_hide_header X-Cache;
    proxy_hide_header Server;
    proxy_hide_header geowebcache-tile-index;
    proxy_hide_header geowebcache-cache-result;
    proxy_hide_header geowebcache-tile-bounds;
    proxy_hide_header geowebcache-gridset;
    proxy_hide_header geowebcache-crs;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Referer "";
    proxy_set_header Origin "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Real-IP "";
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header Accept-Encoding "";
    proxy_set_header User-Agent "ayer.aminox.dev tile cache (+https://ayer.aminox.dev/creditos/)";

    server {
        listen 80;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

        # ---------- IGN proxy ----------
        location = /ign/wms {
            if ($wms_ok = 0) { return 403; }
            limit_req zone=tiles burst=600 nodelay;
            proxy_set_header Host www.ign.es;
            proxy_ssl_name www.ign.es;
            proxy_cache tilecache;
            proxy_cache_key "wms|$arg_LAYERS|$arg_BBOX|$arg_WIDTH";
            proxy_cache_valid 200 180d;
            proxy_cache_valid 404 10m;
            proxy_pass https://ign/wms/pnoa-historico?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=$arg_LAYERS&STYLES=&CRS=EPSG:3857&BBOX=$arg_BBOX&WIDTH=$arg_WIDTH&HEIGHT=$arg_HEIGHT&FORMAT=image/jpeg;
            add_header Cache-Control "public, max-age=2592000, immutable";  # not on errors: those must not be cached anywhere
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /ign/wmts {
            if ($wmts_ok = 0) { return 403; }
            limit_req zone=tiles burst=600 nodelay;
            proxy_set_header Host www.ign.es;
            proxy_ssl_name www.ign.es;
            proxy_cache tilecache;
            proxy_cache_key "wmts|$arg_TileMatrix|$arg_TileCol|$arg_TileRow";
            # The current mosaic is refreshed by the IGN as new surveys arrive.
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 10m;
            proxy_pass https://ign/wmts/pnoa-ma?layer=OI.OrthoimageCoverage&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/jpeg&TileMatrix=$arg_TileMatrix&TileCol=$arg_TileCol&TileRow=$arg_TileRow;
            add_header Cache-Control "public, max-age=604800";  # not on errors: those must not be cached anywhere
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location = /ign/base {
            if ($wmts_ok = 0) { return 403; }
            limit_req zone=tiles burst=600 nodelay;
            proxy_set_header Host www.ign.es;
            proxy_ssl_name www.ign.es;
            proxy_cache tilecache;
            proxy_cache_key "base|$arg_TileMatrix|$arg_TileCol|$arg_TileRow";
            proxy_cache_valid 200 30d;
            proxy_cache_valid 404 10m;
            proxy_pass https://ign/wmts/ign-base?layer=IGNBaseOrto&style=default&tilematrixset=GoogleMapsCompatible&Service=WMTS&Request=GetTile&Version=1.0.0&Format=image/png&TileMatrix=$arg_TileMatrix&TileCol=$arg_TileCol&TileRow=$arg_TileRow;
            add_header Cache-Control "public, max-age=604800";  # not on errors: those must not be cached anywhere
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location ~ ^/ign/geocoder/(candidates|find|reverseGeocode)$ {
            limit_req zone=geo burst=30 nodelay;
            proxy_set_header Host www.cartociudad.es;
            proxy_ssl_name www.cartociudad.es;
            proxy_cache geocache;
            proxy_cache_key "$1|$args";
            proxy_cache_valid 200 1d;
            proxy_pass https://cartociudad/geocoder/api/geocoder/$1$is_args$args;
            add_header Cache-Control "public, max-age=3600";  # not on errors
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }
        location /ign/ {
            return 404;
        }

        # Preview image of a shared view (og:image of /mapa/?...).
        location = /og/view {
            if ($og_upstream = "") { return 302 /og/mapa.jpg; }
            limit_req zone=og burst=20 nodelay;
            proxy_set_header Host www.ign.es;
            proxy_ssl_name www.ign.es;
            proxy_cache tilecache;
            proxy_cache_key "og|$og_upstream";
            proxy_cache_valid 200 180d;
            proxy_read_timeout 60s;
            proxy_pass https://ign$og_upstream;
            add_header Cache-Control "public, max-age=2592000";  # not on errors
            add_header X-Cache $upstream_cache_status always;
            add_header X-Content-Type-Options "nosniff" always;
        }

        # Former English pages (see the map above). Keeps the query, so shared map views still open.
        location ^~ /en/ {
            return 301 $en_to_es$is_args$args;
        }
        location = /en {
            return 301 /;
        }

        # The map page: the preview image follows the shared view.
        location = /mapa/ {
            sub_filter_once off;
            sub_filter "https://ayer.aminox.dev/og/mapa.jpg" $og_image;
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files $uri/index.html =404;
        }

        # ---------- Static site ----------
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable";  # not on errors
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location ~ ^/(places|og|coverage)/ {
            add_header Cache-Control "public, max-age=604800";  # not on errors: those must not be cached anywhere
            add_header X-Content-Type-Options "nosniff" always;
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Referrer-Policy "strict-origin-when-cross-origin" always;
            add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
            add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.google-analytics.com https://*.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; worker-src 'self' blob:; media-src 'self' blob:; font-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
            try_files $uri $uri/ =404;
        }
        error_page 404 /404.html;
        location = /404.html {
            internal;
        }
    }
}
